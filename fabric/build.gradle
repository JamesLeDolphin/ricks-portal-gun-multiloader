plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")

    //Forge Config API Port
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${config_version}"

    //JEI
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    //modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
    //modImplementation("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    //EMI
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    //Infinite Dimensions
    modCompileOnly("maven.modrinth:infinite-dimensions:2.4.11+1.20.1-fabric")
    //modRuntimeOnly("maven.modrinth:infinite-dimensions:2.4.11+1.20.1-fabric")

    //modRuntimeOnly("maven.modrinth:architectury-api:9.2.14+fabric")

    //Immersive Portals
    modCompileOnly ("com.github.iPortalTeam.ImmersivePortalsMod:imm_ptl_core:v3.3.7-mc1.20.1")
    modCompileOnly ("com.github.iPortalTeam.ImmersivePortalsMod:q_misc_util:v3.3.7-mc1.20.1")
    modCompileOnly ("com.github.iPortalTeam.ImmersivePortalsMod:build:v3.3.7-mc1.20.1")

    modRuntimeOnly ("me.shedaniel.cloth:cloth-config-forge:11.1.136") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    //CC: Tweaked
    modCompileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-fabric-api:${cct_version}")
  //  modRuntimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-fabric:${cct_version}")

    //Iris & Sodium
    modCompileOnly "curse.maven:irisshaders-455508:6258195"
    modImplementation "curse.maven:sodium-394468:6260639"


    //Create
    modCompileOnly("com.simibubi.create:create-fabric-$minecraft_version:$create_fabric_version")
    modRuntimeOnly("maven.modrinth:indium:1.0.36+mc1.20.1")
}

repositories {
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    maven { url 'https://jitpack.io' }

    //CC: Tweaked
    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }

    // the repository for Cloth Config
    maven { url 'https://maven.shedaniel.me' }

    maven { url = "https://mvn.devos.one/releases" } // Porting Lib releases
    maven { url = "https://mvn.devos.one/snapshots" } // Create and several dependencies
    maven { url = "https://maven.createmod.net/" } // Flywheel

    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes

    maven { // Fabric ASM for Porting Lib
        url = "https://jitpack.io/"
        content { includeGroupAndSubgroups("com.github") }
    }
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
